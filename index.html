<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chez nous — Aujourd'hui</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="gate">
  <div class="carte">
    <h2 class="titre">🏡 Chez nous</h2>
    <p>Mot de passe famille</p>
    <form id="gate-form">
      <input id="gate-input" type="password" placeholder="•••••••" autofocus>
      <button type="submit">Entrer</button>
    </form>
    <p class="erreur" id="gate-erreur"></p>
  </div>
</div>

<div id="app">
  <header class="entete">
    <h1 class="titre">🏡 Chez nous</h1>
    <div class="date-du-jour" id="date-jour"></div>
  </header>
  <nav class="modules">
    <a href="index.html">🏠 Aujourd'hui</a>
    <a href="menage.html">🧹 Ménage</a>
    <a href="agenda.html">📅 Agenda</a>
    <a href="activites.html">🎒 Activités</a>
    <a href="checklists.html">✅ Checklists</a>
    <a href="parametres.html">⚙️ Réglages</a>
  </nav>
  <main>

    <div class="carte" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <strong>Aujourd'hui c'est :</strong>
      <div id="type-semaine-toggle" style="display:flex;gap:6px;"></div>
    </div>

    <div id="tous-du-jour"></div>

    <h2 class="section-titre">Pour chacun</h2>
    <div class="lanes" id="lanes"></div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
document.getElementById('date-jour').textContent = formatDateLongue(dateAujourdhui());

function typeSemaineParDefaut() {
  const jour = new Date().getDay();
  return jour === 3 ? 'mercredi' : 'normal';
}
function getTypeSemaine() {
  return localStorage.getItem('type_semaine_' + dateAujourdhui()) || typeSemaineParDefaut();
}
function setTypeSemaine(t) {
  localStorage.setItem('type_semaine_' + dateAujourdhui(), t);
  chargerLanes();
}

function renderToggle() {
  const actuel = getTypeSemaine();
  const options = [['normal', '📚 Jour normal'], ['mercredi', '🌤️ Mercredi'], ['vacances', '🏖️ Vacances']];
  document.getElementById('type-semaine-toggle').innerHTML = options.map(([val, label]) => `
    <button class="btn" style="background:${val === actuel ? 'var(--ink)' : 'var(--paper)'};color:${val === actuel ? 'var(--bg)' : 'var(--ink)'};border:2px solid var(--border)"
      onclick="setTypeSemaine('${val}')">${label}</button>
  `).join('');
}

async function toggleTache(tacheId, membreId, faitActuel) {
  const nouvelEtat = !faitActuel;
  await sb.from('taches_menage_log').upsert({
    tache_id: tacheId,
    date: dateAujourdhui(),
    fait: nouvelEtat,
    fait_par: membreId,
    fait_le: nouvelEtat ? new Date().toISOString() : null
  }, { onConflict: 'tache_id,date' });
  chargerLanes();
}

async function chargerLanes() {
  const jourSemaine = new Date().getDay();
  const typeSemaine = getTypeSemaine();
  const auj = dateAujourdhui();

  const [membres, taches, logs, planning, evenements] = await Promise.all([
    getMembres(),
    sb.from('taches_menage').select('*').eq('actif', true),
    sb.from('taches_menage_log').select('*').eq('date', auj),
    sb.from('planning_recurrent').select('*').eq('jour_semaine', jourSemaine).eq('type_semaine', typeSemaine),
    sb.from('evenements').select('*').gte('date_debut', auj + 'T00:00:00').lte('date_debut', auj + 'T23:59:59')
  ]);

  const logsMap = {};
  (logs.data || []).forEach(l => logsMap[l.tache_id] = l);

  // Événements "tous"
  const evtsTous = (evenements.data || []).filter(e => !e.membre_id);
  const zoneTous = document.getElementById('tous-du-jour');
  zoneTous.innerHTML = evtsTous.length ? `
    <h2 class="section-titre">👨‍👩‍👧‍👦 Toute la famille</h2>
    <div class="carte">
      ${evtsTous.map(e => `<div class="item-ligne"><span class="heure">${formatHeure(e.date_debut.slice(11,16))}</span> ${e.titre} ${e.lieu ? '— ' + e.lieu : ''}</div>`).join('')}
    </div>` : '';

  const lanes = document.getElementById('lanes');
  lanes.innerHTML = membres.map(m => {
    const tachesM = (taches.data || []).filter(t => t.membre_id === m.id);
    const planningM = (planning.data || []).filter(p => p.membre_id === m.id);
    const evtsM = (evenements.data || []).filter(e => e.membre_id === m.id);

    const rienDuTout = tachesM.length === 0 && planningM.length === 0 && evtsM.length === 0;

    return `
      <div class="lane" style="--m-color:${m.couleur}">
        <h3>${m.icone} ${m.nom}</h3>
        ${planningM.map(p => `<div class="item-ligne">📍 ${p.lieu} <span class="heure">${formatHeure(p.heure_debut)}–${formatHeure(p.heure_fin)}</span></div>`).join('')}
        ${evtsM.map(e => `<div class="item-ligne">🗓️ ${e.titre} <span class="heure">${formatHeure(e.date_debut.slice(11,16))}</span></div>`).join('')}
        ${tachesM.map(t => {
          const log = logsMap[t.id];
          const fait = log ? log.fait : false;
          return `<div class="item-ligne ${fait ? 'fait' : ''}">
            <input type="checkbox" ${fait ? 'checked' : ''} onchange="toggleTache('${t.id}','${m.id}',${fait})">
            ${t.icone} ${t.libelle}
          </div>`;
        }).join('')}
        ${rienDuTout ? '<div class="rien">Rien de prévu, journée tranquille ✨</div>' : ''}
      </div>
    `;
  }).join('');
}

function initPage() {
  renderToggle();
  chargerLanes();
}
</script>
</body>
</html>
