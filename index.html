<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chez nous — Aujourd'hui</title>
<link rel="manifest" href="assets/manifest.json">
<meta name="theme-color" content="#D97757">
<link rel="icon" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="stylesheet" href="assets/style.css?v=7">
<style>
  .alerte-checklist {
    border-left: 4px solid var(--maman);
    background: #FBEEE8;
    margin-bottom: 16px;
  }
  .alerte-checklist strong { color: var(--maman); }
</style>
</head>
<body>

<div id="gate">
  <div class="carte">
    <h2 class="titre">🏡 Chez nous</h2>
    <p>Connexion famille</p>
    <form id="gate-form">
      <input id="gate-email" type="email" placeholder="Email" autocomplete="username" autofocus>
      <input id="gate-input" type="password" placeholder="Mot de passe" autocomplete="current-password">
      <button type="submit">Entrer</button>
    </form>
    <p class="erreur" id="gate-erreur"></p>
  </div>
</div>

<div id="app">
  <header class="entete">
    <h1 class="titre">🏡 Chez nous</h1>
    <div class="date-du-jour" id="date-jour"></div>
  </header>
  <nav class="modules">
    <a href="index.html">🏠 Aujourd'hui</a>
    <a href="menage.html">🧹 Tâches</a>
    <a href="agenda.html">📅 Agenda</a>
    <a href="activites.html">🎒 Activités</a>
    <a href="checklists.html">✅ Checklists</a>
    <a href="baptiste.html">👦 Baptiste</a>
    <a href="budget.html">💶 Budget</a>
    <a href="parametres.html">⚙️ Réglages</a>
  </nav>
  <main>

    <div id="alerte-checklists" style="display:none;"></div>

    <div class="vue-tabs">
      <button id="tab-jour" onclick="changerVue('jour')">📆 Jour</button>
      <button id="tab-semaine" class="actif" onclick="changerVue('semaine')">🗓️ Semaine</button>
      <button id="tab-mois" onclick="changerVue('mois')">📅 Mois</button>
    </div>

    <div id="encart-sans-date" style="display:none;"></div>

    <!-- ---------- Vue Jour ---------- -->
    <div id="vue-jour" style="display:none;">
      <div id="tous-du-jour"></div>
      <h2 class="section-titre">Pour chacun</h2>
      <div class="lanes" id="lanes"></div>
    </div>

    <!-- ---------- Vue Semaine ---------- -->
    <div id="vue-semaine">
      <div class="semaine-nav">
        <button class="btn" onclick="deplacerSemaine(-1)">◀</button>
        <button class="btn" onclick="allerSemaineActuelle()">Cette semaine</button>
        <button class="btn" onclick="deplacerSemaine(1)">▶</button>
      </div>
      <div class="semaine-grid" id="semaine-grid"></div>
    </div>

    <!-- ---------- Vue Mois ---------- -->
    <div id="vue-mois" style="display:none;">
      <div class="mois-nav">
        <button class="btn" onclick="deplacerMois(-1)">◀</button>
        <button class="btn" id="mois-titre" onclick="allerMoisActuel()">Ce mois</button>
        <button class="btn" onclick="deplacerMois(1)">▶</button>
      </div>
      <div class="mois-grid" id="mois-grid"></div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js?v=7"></script>
<script src="assets/app.js?v=7"></script>
<script>
document.getElementById('date-jour').textContent = formatDateLongue(dateAujourdhui());

async function chargerAlerteChecklists() {
  const [{ data: instances }, { data: items }] = await Promise.all([
    sb.from('checklists_instances').select('*'),
    sb.from('checklists_instance_items').select('*')
  ]);
  const zone = document.getElementById('alerte-checklists');
  const nonFinies = (instances || []).map(inst => {
    const itemsInst = (items || []).filter(it => it.instance_id === inst.id);
    return { nom: inst.nom, nbFait: itemsInst.filter(it => it.coche).length, total: itemsInst.length };
  }).filter(x => x.total > 0 && x.nbFait < x.total);

  if (!nonFinies.length) { zone.style.display = 'none'; zone.innerHTML = ''; return; }
  zone.style.display = 'block';
  zone.innerHTML = `
    <div class="carte alerte-checklist">
      <strong>⚠️ Checklist${nonFinies.length > 1 ? 's' : ''} en cours non terminée${nonFinies.length > 1 ? 's' : ''}</strong>
      ${nonFinies.map(x => `
        <div class="item-ligne">
          <span style="flex:1;">${x.nom}</span>
          <span style="color:var(--ink-soft);font-size:0.85rem;">${x.nbFait}/${x.total}</span>
        </div>
      `).join('')}
      <a class="btn" href="checklists.html" style="display:inline-block;margin-top:10px;text-decoration:none;">Voir les checklists</a>
    </div>
  `;
}

function changerVue(v) {
  ['jour','semaine','mois'].forEach(x => {
    document.getElementById('vue-' + x).style.display = x === v ? 'block' : 'none';
    document.getElementById('tab-' + x).classList.toggle('actif', x === v);
  });
  if (v === 'jour') chargerLanes();
  if (v === 'semaine') chargerSemaine();
  if (v === 'mois') chargerMois();
  if (v === 'jour') {
    document.getElementById('encart-sans-date').style.display = 'none';
  } else {
    chargerEncartSansDate();
  }
}

async function chargerEncartSansDate() {
  const [membres, res] = await Promise.all([
    getMembres(),
    sb.from('taches_menage').select('*').eq('actif', true).eq('frequence', 'ponctuel').is('date_prevue', null).order('libelle')
  ]);
  const membresParId = Object.fromEntries(membres.map(m => [m.id, m]));
  const data = res.data || [];
  const zone = document.getElementById('encart-sans-date');
  if (!data.length) { zone.style.display = 'none'; zone.innerHTML = ''; return; }
  zone.style.display = 'block';
  zone.innerHTML = `
    <div class="carte encart-travaux">
      <h4>🧰 Travaux / ménage à faire (sans date précise)</h4>
      ${data.map(t => `
        <div class="item-ligne">
          <input type="checkbox" onchange="terminerTravail('${t.id}')">
          <span>${t.icone || '🧹'} ${t.libelle}</span>
          ${badgeMembre(membresParId[t.membre_id])}
        </div>
      `).join('')}
    </div>
  `;
}

// Une tâche "ponctuelle" (travaux / à penser) n'a pas vocation à revenir : la cocher la termine
// définitivement, comme le bouton "✅ Terminé" de la page Tâches — plutôt que de juste logger
// "faite aujourd'hui", ce qui la ferait réapparaître décochée le jour suivant.
async function terminerTacheDefinitivement(id) {
  await sb.from('taches_menage').update({ actif: false }).eq('id', id);
}

async function terminerTravail(id) {
  await terminerTacheDefinitivement(id);
  chargerEncartSansDate();
}

// ================= VUE JOUR =================
async function toggleTache(tacheId, membreId, faitActuel, frequence) {
  if (frequence === 'ponctuel') {
    await terminerTacheDefinitivement(tacheId);
    chargerLanes();
    return;
  }
  const nouvelEtat = !faitActuel;
  await sb.from('taches_menage_log').upsert({
    tache_id: tacheId,
    date: dateAujourdhui(),
    fait: nouvelEtat,
    fait_par: membreId,
    fait_le: nouvelEtat ? new Date().toISOString() : null
  }, { onConflict: 'tache_id,date' });
  chargerLanes();
}

async function chargerLanes() {
  const jourSemaine = new Date().getDay();
  const auj = dateAujourdhui();
  const bornInf = new Date(Date.now() - 60 * 86400000).toISOString().slice(0, 10);
  const bornSup = new Date(Date.now() + 60 * 86400000).toISOString().slice(0, 10);

  const [membres, taches, logs, planning, evenementsRes, exceptionsRes] = await Promise.all([
    getMembres(),
    sb.from('taches_menage').select('*').eq('actif', true),
    sb.from('taches_menage_log').select('*').eq('date', auj),
    sb.from('planning_recurrent').select('*').eq('jour_semaine', jourSemaine),
    sb.from('evenements').select('*').gte('date_debut', bornInf + 'T00:00:00').lte('date_debut', bornSup + 'T23:59:59'),
    sb.from('taches_menage_exceptions').select('tache_id').eq('date', auj)
  ]);

  const idsExclusAuj = new Set((exceptionsRes.data || []).map(e => e.tache_id));
  const logsMap = {};
  (logs.data || []).forEach(l => logsMap[l.tache_id] = l);

  const evenementsDuJour = (evenementsRes.data || []).filter(e => evenementCouvre(e, auj));
  const evtsTous = evenementsDuJour.filter(e => !e.membre_id);
  const zoneTous = document.getElementById('tous-du-jour');
  zoneTous.innerHTML = evtsTous.length ? `
    <h2 class="section-titre">👨‍👩‍👧‍👦 Toute la famille</h2>
    <div class="carte">
      ${evtsTous.map(e => `
        <div class="item-ligne">
          ${e.mode === 'remplace' ? '🏖️' : '🗓️'} ${e.titre}
          ${e.lieu ? '— ' + e.lieu : ''}
          ${e.date_debut.slice(11,16) !== '00:00' ? `<span class="heure">${e.date_debut.slice(11,16)}</span>` : ''}
        </div>`).join('')}
    </div>` : '';

  const lanes = document.getElementById('lanes');
  lanes.innerHTML = membres.map(m => {
    const evtsM = evenementsDuJour.filter(e => e.membre_id === m.id);
    const evtsRemplace = [...evtsM, ...evtsTous].filter(e => e.mode === 'remplace');
    const evtsAjout = evtsM.filter(e => e.mode === 'ajout');
    const planningM = evtsRemplace.length ? [] : (planning.data || []).filter(p => p.membre_id === m.id);
    const tachesM = (taches.data || []).filter(t => t.membre_id === m.id && !idsExclusAuj.has(t.id) && (t.frequence === 'quotidien' || t.frequence === 'mensuel' || t.frequence === 'ponctuel' || (t.frequence === 'hebdo' && (t.jours_semaine || []).includes(jourSemaine))));
    const rienDuTout = tachesM.length === 0 && planningM.length === 0 && evtsAjout.length === 0 && evtsRemplace.length === 0;

    return `
      <div class="lane" style="--m-color:${m.couleur}">
        <h3>${avatarMembre(m)} ${m.nom}</h3>
        ${evtsRemplace.filter(e => e.membre_id === m.id).map(e => `<div class="item-ligne">🏖️ ${e.titre}</div>`).join('')}
        ${planningM.map(p => `<div class="item-ligne">📍 ${p.lieu} <span class="heure">${formatHeure(p.heure_debut)}–${formatHeure(p.heure_fin)}</span></div>`).join('')}
        ${evtsAjout.map(e => `<div class="item-ligne">🗓️ ${e.titre} ${e.date_debut.slice(11,16) !== '00:00' ? `<span class="heure">${e.date_debut.slice(11,16)}</span>` : ''}</div>`).join('')}
        ${tachesM.map(t => {
          const log = logsMap[t.id];
          const fait = log ? log.fait : false;
          return `<div class="item-ligne ${fait ? 'fait' : ''}">
            <input type="checkbox" ${fait ? 'checked' : ''} onchange="toggleTache('${t.id}','${m.id}',${fait},'${t.frequence}')">
            ${t.icone} ${t.libelle}
          </div>`;
        }).join('')}
        ${rienDuTout ? '<div class="rien">Rien de prévu, journée tranquille ✨</div>' : ''}
      </div>
    `;
  }).join('');
}

// ================= VUE SEMAINE =================
let offsetSemaine = 0;
function lundiDeLaSemaine(date) {
  const d = new Date(date);
  const jour = d.getDay(); // 0=dimanche
  const decalage = jour === 0 ? -6 : 1 - jour;
  d.setDate(d.getDate() + decalage);
  d.setHours(0,0,0,0);
  return d;
}
function deplacerSemaine(delta) { offsetSemaine += delta; chargerSemaine(); }
function allerSemaineActuelle() { offsetSemaine = 0; chargerSemaine(); }
async function terminerTravailSemaine(id) {
  await terminerTacheDefinitivement(id);
  chargerSemaine();
}

async function chargerSemaine() {
  const base = new Date();
  if (base.getDay() === 0) base.setDate(base.getDate() + 1); // dimanche -> on regarde la semaine à venir
  base.setDate(base.getDate() + offsetSemaine * 7);
  const lundi = lundiDeLaSemaine(base);
  const jours = [...Array(7)].map((_, i) => {
    const d = new Date(lundi);
    d.setDate(d.getDate() + i);
    return d;
  });
  const dateStrs = jours.map(d => formatDateLocale(d));

  const bornInf = new Date(lundi.getTime() - 60 * 86400000).toISOString().slice(0, 10);
  const bornSup = new Date(lundi.getTime() + 66 * 86400000).toISOString().slice(0, 10);

  const [membres, planning, evenementsRes, activitesRes, travauxRes] = await Promise.all([
    getMembres(),
    sb.from('planning_recurrent').select('*'),
    sb.from('evenements').select('*').gte('date_debut', bornInf + 'T00:00:00').lte('date_debut', bornSup + 'T23:59:59'),
    sb.from('idees_activites').select('*').eq('statut', 'idee').not('date_prevue', 'is', null),
    sb.from('taches_menage').select('*').eq('actif', true).eq('frequence', 'ponctuel').not('date_prevue', 'is', null)
  ]);

  const grid = document.getElementById('semaine-grid');
  grid.innerHTML = jours.map((d, i) => {
    const ds = dateStrs[i];
    const jourSemaine = d.getDay();
    const evtsJour = (evenementsRes.data || []).filter(e => evenementCouvre(e, ds));
    const evtsTousJour = evtsJour.filter(e => !e.membre_id);
    const estVacances = evtsTousJour.some(e => e.mode === 'remplace');
    const activitesJour = (activitesRes.data || []).filter(a => a.date_prevue === ds);
    const travauxJour = (travauxRes.data || []).filter(t => t.date_prevue === ds);

    const contenu = membres.map(m => {
      const evtsM = evtsJour.filter(e => e.membre_id === m.id);
      const remplace = [...evtsM, ...evtsTousJour].filter(e => e.mode === 'remplace');
      const ajout = evtsM.filter(e => e.mode === 'ajout');
      const planningM = remplace.length ? [] : (planning.data || []).filter(p => p.membre_id === m.id && p.jour_semaine === jourSemaine);
      if (!remplace.length && !ajout.length && !planningM.length) return '';
      return `
        <div class="item-ligne">
          ${avatarMembre(m)}
          <span>
            ${remplace.map(e => `🏖️ ${e.titre}`).join('<br>')}
            ${planningM.map(p => `📍 ${p.lieu} ${formatHeure(p.heure_debut)}`).join('<br>')}
            ${ajout.map(e => `🗓️ ${e.titre}`).join('<br>')}
          </span>
        </div>`;
    }).join('')
      + evtsTousJour.map(e => `<div class="item-ligne">👨‍👩‍👧‍👦 ${e.titre}</div>`).join('')
      + activitesJour.map(a => `<div class="item-ligne">🎒 ${a.titre}</div>`).join('')
      + travauxJour.map(t => `
        <div class="item-ligne">
          <input type="checkbox" onchange="terminerTravailSemaine('${t.id}')">
          <span>🧰 ${t.libelle}</span>
        </div>`).join('');

    return `
      <div class="jour-carte ${estVacances ? 'vacances' : ''} ${ds === dateAujourdhui() ? 'aujourdhui' : ''}">
        <h4>${d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' })}</h4>
        ${contenu || '<div class="rien">Rien de prévu</div>'}
      </div>
    `;
  }).join('');
}

// ================= VUE MOIS =================
let offsetMois = 0;
function deplacerMois(delta) { offsetMois += delta; chargerMois(); }
function allerMoisActuel() { offsetMois = 0; chargerMois(); }

async function chargerMois() {
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + offsetMois);
  const mois = base.getMonth();
  const annee = base.getFullYear();

  document.getElementById('mois-titre').textContent = base.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

  const premierJourMois = new Date(annee, mois, 1);
  const dernierJourMois = new Date(annee, mois + 1, 0);
  const debutGrille = lundiDeLaSemaine(premierJourMois);
  const finGrille = new Date(dernierJourMois);
  const decalageFin = finGrille.getDay() === 0 ? 0 : 7 - finGrille.getDay();
  finGrille.setDate(finGrille.getDate() + decalageFin);

  const jours = [];
  let curseur = new Date(debutGrille);
  while (curseur <= finGrille) {
    jours.push(new Date(curseur));
    curseur.setDate(curseur.getDate() + 1);
  }

  const bornInf = debutGrille.toISOString().slice(0, 10);
  const bornSup = new Date(finGrille.getTime() + 60 * 86400000).toISOString().slice(0, 10);
  const bornInfLarge = new Date(debutGrille.getTime() - 60 * 86400000).toISOString().slice(0, 10);

  const [membres, evenementsRes, activitesRes, travauxRes] = await Promise.all([
    getMembres(),
    sb.from('evenements').select('*').gte('date_debut', bornInfLarge + 'T00:00:00').lte('date_debut', bornSup + 'T23:59:59'),
    sb.from('idees_activites').select('*').eq('statut', 'idee').not('date_prevue', 'is', null),
    sb.from('taches_menage').select('*').eq('actif', true).eq('frequence', 'ponctuel').not('date_prevue', 'is', null)
  ]);
  const membresParId = Object.fromEntries(membres.map(m => [m.id, m]));

  const noms = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  let html = noms.map(n => `<div class="mois-entete-jour">${n}</div>`).join('');

  html += jours.map(d => {
    const ds = formatDateLocale(d);
    const evtsJour = (evenementsRes.data || []).filter(e => evenementCouvre(e, ds));
    const activitesJour = (activitesRes.data || []).filter(a => a.date_prevue === ds);
    const travauxJour = (travauxRes.data || []).filter(t => t.date_prevue === ds);
    const horsMois = d.getMonth() !== mois;
    const estAujourdhui = ds === dateAujourdhui();
    const estVacances = evtsJour.some(e => !e.membre_id && e.mode === 'remplace');
    const MAX_AFFICHES = 3;

    const chipsEvt = evtsJour.map(e => {
      const m = membresParId[e.membre_id];
      return `<span class="mois-evt" style="background:${m ? m.couleur : 'var(--tous)'}" title="${e.titre}">${e.titre}</span>`;
    });
    const chipsAct = activitesJour.map(a => `<span class="mois-evt" style="background:var(--activite)" title="${a.titre}">🎒 ${a.titre}</span>`);
    const chipsTrav = travauxJour.map(t => `<span class="mois-evt" style="background:var(--travaux)" title="${t.libelle}">🧰 ${t.libelle}</span>`);
    const toutesLesChips = [...chipsEvt, ...chipsAct, ...chipsTrav];
    const reste = toutesLesChips.length - MAX_AFFICHES;

    return `
      <div class="mois-cellule ${horsMois ? 'hors-mois' : ''} ${estVacances ? 'vacances' : ''} ${estAujourdhui ? 'aujourdhui' : ''}">
        <div class="mois-jour-num">${d.getDate()}</div>
        ${toutesLesChips.slice(0, MAX_AFFICHES).join('')}
        ${reste > 0 ? `<div class="mois-evt-plus">+${reste}</div>` : ''}
      </div>
    `;
  }).join('');

  document.getElementById('mois-grid').innerHTML = html;
}

function initPage() {
  chargerSemaine();
  chargerEncartSansDate();
  chargerAlerteChecklists();
}
</script>
</body>
</html>
