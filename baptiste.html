<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'espace de Baptiste</title>
<link rel="manifest" href="assets/manifest.json">
<meta name="theme-color" content="#D97757">
<link rel="icon" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="stylesheet" href="assets/style.css?v=7">
<style>
  .defi-jour {
    max-width: 480px;
    margin: 0 auto 20px;
    border: 3px solid var(--baptiste);
    text-align: center;
  }
  .defi-jour h3 { margin-bottom: 10px; font-size: 1.15rem; }
  .defi-question { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; }
  .defi-zone { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .defi-zone input {
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--border);
    width: 160px;
    text-align: center;
  }
  .defi-zone input:focus { border-color: var(--baptiste); outline: none; }
  .defi-message { margin-top: 12px; font-weight: 800; min-height: 1.4em; }
  .defi-message.ok { color: var(--louis); }
  .defi-message.non { color: var(--maman); }
  .defi-jour.resolu { border-color: var(--louis); background: #F1F8EC; }
</style>
</head>
<body class="enfant">

<div id="gate">
  <div class="carte">
    <h2 class="titre">🏡 Chez nous</h2>
    <p>Mot de passe famille</p>
    <form id="gate-form">
      <input id="gate-input" type="password" placeholder="•••••••" autofocus>
      <button type="submit">Entrer</button>
    </form>
    <p class="erreur" id="gate-erreur"></p>
  </div>
</div>

<div id="app">
  <header class="entete">
    <h1 class="titre">👋 Salut Baptiste !</h1>
    <div class="date-du-jour" id="date-jour"></div>
    <a class="retour" href="index.html">← Retour à l'appli</a>
  </header>
  <main>

    <div class="carte defi-jour" id="defi-jour">
      <h3>🧩 Le défi du jour</h3>
      <p class="defi-question" id="defi-question"></p>
      <div class="defi-zone" id="defi-zone">
        <input id="defi-reponse" type="text" placeholder="Ta réponse" autocomplete="off">
        <button class="btn" onclick="validerDefi()">Valider</button>
      </div>
      <p class="defi-message" id="defi-message"></p>
    </div>

    <div class="scores-enfant">
      <div class="score-pastille" style="background:var(--maman);">
        <span class="valeur" id="score-jour">0 ⭐</span>
        <span class="label">Aujourd'hui</span>
      </div>
      <div class="score-pastille" style="background:var(--baptiste);">
        <span class="valeur" id="score-semaine">0 ⭐</span>
        <span class="label">Cette semaine</span>
      </div>
      <div class="score-pastille" style="background:var(--papa);">
        <span class="valeur" id="score-mois">0 ⭐</span>
        <span class="label">Ce mois</span>
      </div>
    </div>

    <div class="semaine-nav" style="justify-content:center;">
      <button class="btn" onclick="deplacerJourEnfant(-1)">◀</button>
      <button class="btn" id="jour-enfant-label" onclick="allerAujourdhuiEnfant()">Aujourd'hui</button>
      <button class="btn" id="jour-enfant-suivant" onclick="deplacerJourEnfant(1)">▶</button>
    </div>

    <div class="taches-enfant" id="liste-taches-enfant"></div>
    <div id="liste-taches-exclues" style="max-width:480px;margin:10px auto 0;"></div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js?v=7"></script>
<script src="assets/app.js?v=7"></script>
<script>
document.getElementById('date-jour').textContent = formatDateLongue(dateAujourdhui());

const POINTS_PAR_TACHE = 10;
let _baptiste = null;
let _tachesBaptiste = [];
let _offsetJour = 0;

function dateConsultee() {
  const d = new Date();
  d.setDate(d.getDate() + _offsetJour);
  return formatDateLocale(d);
}

function majLabelJour() {
  const label = document.getElementById('jour-enfant-label');
  if (_offsetJour === 0) {
    label.textContent = "Aujourd'hui";
  } else if (_offsetJour === -1) {
    label.textContent = 'Hier';
  } else {
    const d = new Date();
    d.setDate(d.getDate() + _offsetJour);
    label.textContent = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short' });
  }
  document.getElementById('jour-enfant-suivant').disabled = _offsetJour >= 0;
  document.getElementById('jour-enfant-suivant').style.opacity = _offsetJour >= 0 ? 0.4 : 1;
}

function deplacerJourEnfant(delta) {
  if (_offsetJour + delta > 0) return; // jamais dans le futur
  _offsetJour += delta;
  majLabelJour();
  chargerTachesEnfant();
}
function allerAujourdhuiEnfant() {
  _offsetJour = 0;
  majLabelJour();
  chargerTachesEnfant();
}

async function trouverBaptiste() {
  const membres = await getMembres();
  return membres.find(m => m.nom.trim().toLowerCase() === 'baptiste') || null;
}

function tachesPourJour(jourSemaine) {
  return _tachesBaptiste.filter(t =>
    t.frequence === 'quotidien' || t.frequence === 'mensuel' || t.frequence === 'ponctuel' ||
    (t.frequence === 'hebdo' && (t.jours_semaine || []).includes(jourSemaine))
  );
}

async function chargerScores() {
  if (!_baptiste) return;
  const auj = dateAujourdhui();
  const lundi = formatDateLocale(lundiDeLaSemaine(new Date()));
  const dimanche = formatDateLocale(new Date(lundiDeLaSemaine(new Date()).getTime() + 6 * 86400000));
  const premierDuMois = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const dernierDuMois = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0);

  const [jourRes, semaineRes, moisRes, exceptionsRes] = await Promise.all([
    sb.from('taches_menage_log').select('id').eq('fait_par', _baptiste.id).eq('fait', true).eq('date', auj),
    sb.from('taches_menage_log').select('id').eq('fait_par', _baptiste.id).eq('fait', true).gte('date', lundi).lte('date', dimanche),
    sb.from('taches_menage_log').select('id').eq('fait_par', _baptiste.id).eq('fait', true).gte('date', formatDateLocale(premierDuMois)).lte('date', formatDateLocale(dernierDuMois)),
    sb.from('taches_menage_exceptions').select('tache_id,date')
      .gte('date', lundi < formatDateLocale(premierDuMois) ? lundi : formatDateLocale(premierDuMois))
      .lte('date', dimanche > formatDateLocale(dernierDuMois) ? dimanche : formatDateLocale(dernierDuMois))
  ]);

  // Ensemble "tache_id|date" exclue ce jour-là (n'enlève rien à la fréquence, juste ce jour précis)
  const exclusions = new Set((exceptionsRes.data || []).map(e => `${e.tache_id}|${e.date}`));
  const nbApplicables = (jourSemaine) => tachesPourJour(jourSemaine).length;
  const nbApplicablesDate = (d) => {
    const ds = formatDateLocale(d);
    return tachesPourJour(d.getDay()).filter(t => !exclusions.has(`${t.id}|${ds}`)).length;
  };

  // Totaux possibles (nombre de tâches applicables x points), en retirant les exceptions du jour
  const maxJour = nbApplicablesDate(new Date()) * POINTS_PAR_TACHE;

  let maxSemaine = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(lundiDeLaSemaine(new Date()));
    d.setDate(d.getDate() + i);
    maxSemaine += nbApplicablesDate(d) * POINTS_PAR_TACHE;
  }

  let maxMois = 0;
  for (let d = new Date(premierDuMois); d <= dernierDuMois; d.setDate(d.getDate() + 1)) {
    maxMois += nbApplicablesDate(d) * POINTS_PAR_TACHE;
  }

  const obtenuJour = (jourRes.data || []).length * POINTS_PAR_TACHE;
  const obtenuSemaine = (semaineRes.data || []).length * POINTS_PAR_TACHE;
  const obtenuMois = (moisRes.data || []).length * POINTS_PAR_TACHE;

  document.getElementById('score-jour').textContent = `${obtenuJour}/${maxJour} ⭐`;
  document.getElementById('score-semaine').textContent = `${obtenuSemaine}/${maxSemaine} ⭐`;
  document.getElementById('score-mois').textContent = `${obtenuMois}/${maxMois} ⭐`;
}

async function chargerTachesEnfant() {
  _baptiste = await trouverBaptiste();
  if (!_baptiste) {
    document.getElementById('liste-taches-enfant').innerHTML = '<div class="vide">Aucun membre "Baptiste" trouvé — vérifie le prénom dans Réglages.</div>';
    return;
  }
  const dateVue = dateConsultee();
  const jourSemaine = new Date(dateVue + 'T12:00:00').getDay();

  const [tachesRes, logsRes, exceptionsRes] = await Promise.all([
    sb.from('taches_menage').select('*').eq('actif', true).eq('membre_id', _baptiste.id),
    sb.from('taches_menage_log').select('*').eq('date', dateVue),
    sb.from('taches_menage_exceptions').select('*').eq('date', dateVue)
  ]);
  _tachesBaptiste = tachesRes.data || [];
  const tachesExclues = exceptionsRes.data || [];
  const idsExclus = new Set(tachesExclues.map(e => e.tache_id));

  const logsMap = {};
  (logsRes.data || []).forEach(l => logsMap[l.tache_id] = l);

  const tachesDuJourToutes = tachesPourJour(jourSemaine);
  const tachesDuJour = tachesDuJourToutes.filter(t => !idsExclus.has(t.id));

  const zoneExclues = document.getElementById('liste-taches-exclues');
  const exclues = tachesDuJourToutes.filter(t => idsExclus.has(t.id));
  zoneExclues.innerHTML = exclues.length ? `
    <p style="text-align:center;color:var(--ink-soft);font-size:0.8rem;margin-bottom:6px;">Exclues aujourd'hui (ne comptent pas dans le score) :</p>
    ${exclues.map(t => `
      <div class="item-ligne" style="justify-content:center;gap:8px;color:var(--ink-soft);">
        <span>${t.icone || '🧹'} ${t.libelle}</span>
        <button class="btn" style="background:var(--paper);color:var(--ink);box-shadow:var(--shadow-1);padding:4px 10px;font-size:0.8rem;" onclick="restaurerTacheJour('${t.id}', '${dateVue}')">↩️ Remettre</button>
      </div>
    `).join('')}
  ` : '';

  const zone = document.getElementById('liste-taches-enfant');
  if (!tachesDuJour.length) {
    zone.innerHTML = _offsetJour === 0
      ? '<div class="vide">Rien à faire aujourd\'hui, bravo Baptiste ! 🎉</div>'
      : '<div class="vide">Rien de prévu ce jour-là.</div>';
    return;
  }

  zone.innerHTML = tachesDuJour.map(t => {
    const fait = logsMap[t.id] ? logsMap[t.id].fait : false;
    return `
      <div class="tache-enfant ${fait ? 'coche' : ''}" id="tache-${t.id}">
        <span class="emoji-tache" onclick="basculerTacheEnfant('${t.id}', ${fait}, '${t.frequence}')" style="cursor:pointer;">${t.icone || '🧹'}</span>
        <span class="libelle-tache" onclick="basculerTacheEnfant('${t.id}', ${fait}, '${t.frequence}')" style="cursor:pointer;">${t.libelle}</span>
        <span class="rond-coche" onclick="basculerTacheEnfant('${t.id}', ${fait}, '${t.frequence}')" style="cursor:pointer;">${fait ? '✓' : ''}</span>
        <button title="Exclure ce jour seulement" style="background:none;border:none;color:var(--ink-soft);font-size:0.9rem;cursor:pointer;padding:4px;" onclick="event.stopPropagation(); exclureTacheJour('${t.id}', '${dateVue}')">🚫</button>
      </div>
    `;
  }).join('');
}

async function exclureTacheJour(tacheId, date) {
  await sb.from('taches_menage_exceptions').insert({ tache_id: tacheId, date });
  await chargerTachesEnfant();
  chargerScores();
}

async function restaurerTacheJour(tacheId, date) {
  await sb.from('taches_menage_exceptions').delete().eq('tache_id', tacheId).eq('date', date);
  await chargerTachesEnfant();
  chargerScores();
}

async function basculerTacheEnfant(tacheId, faitActuel, frequence) {
  const nouvelEtat = !faitActuel;
  const carte = document.getElementById('tache-' + tacheId);

  await sb.from('taches_menage_log').upsert({
    tache_id: tacheId,
    date: dateConsultee(),
    fait: nouvelEtat,
    fait_par: _baptiste.id,
    fait_le: nouvelEtat ? new Date().toISOString() : null
  }, { onConflict: 'tache_id,date' });

  if (nouvelEtat) {
    carte.classList.add('coche');
    carte.querySelector('.rond-coche').textContent = '✓';
    const plus = document.createElement('span');
    plus.className = 'plus-points';
    plus.textContent = '+' + POINTS_PAR_TACHE;
    carte.appendChild(plus);
    setTimeout(() => plus.remove(), 1000);
    if (window.confetti) {
      confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 }, colors: ['#D97757', '#E3A93C', '#6E9F5C', '#3E7A8C'] });
    }
    if (frequence === 'ponctuel') {
      await sb.from('taches_menage').update({ actif: false }).eq('id', tacheId);
      carte.classList.add('disparait');
      setTimeout(() => chargerTachesEnfant().then(chargerScores), 400);
    }
  } else {
    carte.classList.remove('coche');
    carte.querySelector('.rond-coche').textContent = '';
  }
  chargerScores();
}

// ================= DEFI DU JOUR =================
const BANQUE_DEFIS = [
  { type: 'calcul', question: 'Combien font 3 + 4 ?', reponse: 7 },
  { type: 'calcul', question: 'Combien font 8 - 5 ?', reponse: 3 },
  { type: 'calcul', question: 'Combien font 2 x 6 ?', reponse: 12 },
  { type: 'calcul', question: 'Combien font 10 - 4 ?', reponse: 6 },
  { type: 'calcul', question: 'Combien font 5 + 9 ?', reponse: 14 },
  { type: 'calcul', question: 'Combien font 4 x 4 ?', reponse: 16 },
  { type: 'calcul', question: 'Combien font 15 - 7 ?', reponse: 8 },
  { type: 'calcul', question: 'Combien font 6 + 6 ?', reponse: 12 },
  { type: 'calcul', question: 'Combien font 20 - 11 ?', reponse: 9 },
  { type: 'calcul', question: 'Combien font 3 x 5 ?', reponse: 15 },
  { type: 'enigme', question: "Plus on m'enlève de morceaux, plus je grandis. Que suis-je ?", reponse: 'un trou' },
  { type: 'enigme', question: "J'ai des dents mais je ne mange pas. Que suis-je ?", reponse: 'un peigne' },
  { type: 'enigme', question: "Je vole sans ailes et je pleure sans yeux. Que suis-je ?", reponse: 'un nuage' },
  { type: 'enigme', question: "Plus je sèche, plus je deviens mouillé. Que suis-je ?", reponse: 'une serviette' },
  { type: 'enigme', question: "On me lance mais je reviens toujours. Que suis-je ?", reponse: 'un boomerang' },
  { type: 'enigme', question: "J'ai un cou mais pas de tête. Que suis-je ?", reponse: 'une bouteille' },
  { type: 'enigme', question: "Je n'ai pas de bouche mais je parle beaucoup. Que suis-je ?", reponse: 'un livre' },
  { type: 'enigme', question: "Je grandis quand tu me nourris avec de l'eau, mais je meurs si tu m'en donnes trop. Que suis-je ?", reponse: 'une plante' },
  { type: 'mot', question: "Complète : le soleil se lève à l'___.", reponse: 'est' },
  { type: 'mot', question: "Complète : un chat miaule, un chien ___.", reponse: 'aboie' },
  { type: 'mot', question: "Complète : en hiver, il fait ___ et parfois il neige.", reponse: 'froid' },
  { type: 'mot', question: "Complète : la capitale de la France est ___.", reponse: 'paris' },
  { type: 'mot', question: "Complète : il y a 7 jours dans une ___.", reponse: 'semaine' },
  { type: 'mot', question: "Complète : la Terre tourne autour du ___.", reponse: 'soleil' },
  { type: 'mot', question: "Complète : une année a 12 ___.", reponse: 'mois' },
  { type: 'mot', question: "Complète : l'abeille fabrique du ___.", reponse: 'miel' },
  { type: 'mot', question: "Complète : le contraire de « grand » est « ___ ».", reponse: 'petit' },
  { type: 'mot', question: "Complète : le contraire de « jour » est « ___ ».", reponse: 'nuit' }
];

function normaliserReponse(s) {
  return String(s).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

// Choisi le meme defi toute la journee, different chaque jour (base sur la date, pas aleatoire).
function defiDuJour() {
  const date = dateAujourdhui();
  let hash = 0;
  for (let i = 0; i < date.length; i++) hash = (hash * 31 + date.charCodeAt(i)) >>> 0;
  return BANQUE_DEFIS[hash % BANQUE_DEFIS.length];
}

function initDefiJour() {
  const defi = defiDuJour();
  const cle = 'defi_' + dateAujourdhui();
  const dejaFait = localStorage.getItem(cle);

  document.getElementById('defi-question').textContent = defi.question;
  const carte = document.getElementById('defi-jour');
  const message = document.getElementById('defi-message');
  const zone = document.getElementById('defi-zone');

  if (dejaFait === 'reussi') {
    carte.classList.add('resolu');
    zone.style.display = 'none';
    message.className = 'defi-message ok';
    message.textContent = `Défi déjà réussi aujourd'hui, bravo ! 🌟 (réponse : ${defi.reponse})`;
    return;
  }

  document.getElementById('defi-reponse').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') validerDefi();
  });
}

function validerDefi() {
  const defi = defiDuJour();
  const saisie = document.getElementById('defi-reponse').value;
  const message = document.getElementById('defi-message');
  if (!saisie.trim()) return;

  const correct = defi.type === 'calcul'
    ? parseFloat(saisie.replace(',', '.')) === defi.reponse
    : normaliserReponse(saisie) === normaliserReponse(defi.reponse);

  if (correct) {
    localStorage.setItem('defi_' + dateAujourdhui(), 'reussi');
    document.getElementById('defi-jour').classList.add('resolu');
    document.getElementById('defi-zone').style.display = 'none';
    message.className = 'defi-message ok';
    message.textContent = 'Bravo Baptiste, bonne réponse ! 🎉';
    if (window.confetti) {
      confetti({ particleCount: 80, spread: 80, origin: { y: 0.6 }, colors: ['#D97757', '#E3A93C', '#6E9F5C', '#3E7A8C'] });
    }
  } else {
    message.className = 'defi-message non';
    message.textContent = "Pas tout à fait... essaie encore ! 💪";
  }
}

async function initPage() {
  majLabelJour();
  initDefiJour();
  await chargerTachesEnfant();
  chargerScores();
}
</script>
</body>
</html>
